exclude: '.project-template|docs/conf.py'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py38-plus]
-   repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
    -   id: black
        args: [--workers=1]
-   repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
    -   id: flake8
        args: [--jobs=1]
        additional_dependencies:
        -   flake8-bugbear==23.9.16
        exclude: setup.py
-   repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
    -   id: autoflake
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
-   repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
    -   id: pydocstyle
        additional_dependencies:
        -   tomli  # required until >= python311
-   repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
    -   id: mdformat
        additional_dependencies:
        -   mdformat-gfm
#-   repo: local
#    hooks:
#    -   id: mypy-local
#        name: run mypy with all dev dependencies present
#        entry: python -m mypy -p faster_eth_abi
#        language: system
#        always_run: true
#        pass_filenames: false
# The release wheel has the same program/data files as v0.2.5. Its source build
# unnecessarily installs keyring/CFFI, which cannot build on Linux CPython 3.13t.
-   repo: local
    hooks:
    -   id: blocklint
        name: blocklint
        entry: blocklint
        language: python
        types: [text]
        additional_dependencies:
        -   'blocklint @ https://files.pythonhosted.org/packages/ea/61/c782cd48f81b1e4641adcdc817bfc97bc4dca28e8f5405ccf3005fc8c590/blocklint-0.2.5-py2.py3-none-any.whl#sha256=c1ee4169551bf04043ad23d3e502df1481ff39118e667da4682136370f1dfd11'
        exclude: 'docs/Makefile|docs/release_notes.rst|tox.ini|.github/workflows/compile.yaml'
-   repo: local
    hooks:
    -   id: check-rst-files
        name: Check for .rst files in the top-level directory
        entry: sh -c 'ls *.rst 1>/dev/null 2>&1 && { echo "found .rst file in top-level folder"; exit 1; } || exit 0'
        language: system
        always_run: true
        pass_filenames: false
