name: Compile
'on':
  pull_request:
    branches:
    - master
    paths:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '[".github/workflows/**", "!.github/workflows/compile.yaml", "benchmarks/**", "tests/**",
          "!eth-abi-stubs/**", "**/*.md", ".gitignore", "*.md"]'
      run: python3 .github/scripts/ci_changes.py
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: 'setup.py

          pyproject.toml

          '
    - name: Cache .mypy_cache
      uses: actions/cache@v6
      with:
        path: .mypy_cache
        key: mypy-cache-${{ runner.os }}-x64-${{ hashFiles('**/*.py', 'pyproject.toml') }}
    - name: Delete existing build files
      run: rm -rf build
    - name: Run Mypyc
      env:
        MYPYC_STRICT_DUNDER_TYPING: 1
      run: pip install .
    - name: Normalize C files for diffchecking
      run: "# Insert DIFFCHECK_PLACEHOLDER macro at the top if not present\nfor f in build/*.c; do\n  if ! grep\
        \ -q 'DIFFCHECK_PLACEHOLDER' \"$f\"; then\n    sed -i '1i#ifndef DIFFCHECK_PLACEHOLDER\\n#define DIFFCHECK_PLACEHOLDER\
        \ 0\\n#endif' \"$f\"\n  fi\ndone\n# Replace line number in CPy_AddTraceback with macro\nsed -i 's/\\(CPy_AddTraceback([^,]*,\
        \ *[^,]*, *\\)[0-9]\\+\\(, *[^)]*)\\)/\\1DIFFCHECK_PLACEHOLDER\\2/g' build/*.c\n# Replace index in CPyStatics[...]\
        \ with macro\nsed -i 's/CPyStatics\\[[0-9]\\+\\]/CPyStatics[DIFFCHECK_PLACEHOLDER]/g' build/*.c\n"
    - name: Normalize generated whitespace for native lint
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        for path in Path("build").rglob("*"):
            if path.suffix in (".c", ".h"):
                path.write_text("\n".join(line.rstrip() for line in path.read_text().splitlines()) + "\n")
        PYTHON
    - name: Upload canonical generated C and headers
      uses: actions/upload-artifact@v7
      with:
        name: canonical-generated-c
        path: 'build/**/*.c

          build/**/*.h

          '
        if-no-files-found: error
    - name: Verify checked-in generated sources
      run: 'git diff --exit-code -- build

        python - <<''PYTHON''

        import subprocess

        files = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "--", "build"], text=True).splitlines()

        assert not [name for name in files if name.endswith((".c", ".h"))], files

        PYTHON'
    env:
      PYTHONHASHSEED: '0'
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
    permissions:
      contents: read
  ci_gate:
    name: CI (compile.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - build-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["build-ubuntu"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
permissions:
  contents: read
