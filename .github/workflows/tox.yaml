name: Tox
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '["faster_eth_abi/**.py","tests/**.py",".github/workflows/tox.yaml",".github/workflows/tox-reviewed-linux.yaml","pyproject.toml","setup.py","tox.ini","!eth-abi-stubs/**"]'
        CI_IGNORE_PATHS: '[]'
      run: python3 .github/scripts/ci_changes.py
  test:
    name: Test (${{ matrix.jobtype }}, 3.${{ matrix.pyminor }}, ${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.installmode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        jobtype:
        - core
        - wheel
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        architecture:
        - x64
        - x86
        pyminor:
        - '10'
        - '11'
        - '12'
        - '13'
        - 13t
        - '14'
        - 14t
        installmode:
        - source
        - sdist
        exclude:
        - os: ubuntu-latest
          architecture: x64
        - os: macos-latest
          architecture: x86
        - installmode: sdist
          architecture: x86
      max-parallel: ${{ github.event_name == 'schedule' && 4 || 1000 }}
    env:
      IS_UBUNTU_32BIT: ${{ matrix.os == 'ubuntu-latest' && matrix.architecture == 'x86' }}
      TOXENV: py3${{ matrix.pyminor }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}
    steps:
    - name: Checkout code and tests
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Run job in 32-bit Ubuntu Docker container
      if: ${{ env.IS_UBUNTU_32BIT == 'true' }}
      shell: bash
      run: "set -euo pipefail\n# Reuse the runner's working DNS for legacy 32-bit container libc.\ndocker_hosts=()\nfor hostname in pypi.org files.pythonhosted.org; do\n  address=$(getent ahostsv4 \"$hostname\" | awk 'NR == 1 {print $1}')\n  test -n \"$address\"\n  docker_hosts+=(--add-host \"$hostname:$address\")\ndone\ndocker run --rm -i --network host \"${docker_hosts[@]}\" \\\n  -e TOXENV -e TOX_RECREATE_FLAG -e IS_UBUNTU_32BIT \\\n  -v \"${{ github.workspace }}:/workspace\" -w /workspace \\\n  i386/python:3.${{ matrix.pyminor }} bash -se <<'CI_CONTAINER'\nset -euo pipefail\npython -m pip install --upgrade pip\npython -m pip install tox\nif [[ \"${{ matrix.jobtype }}\" == \"wheel\" ]]; then\n  python -m pip install \"build[virtualenv]\"\n  python -m build --wheel\n  export WHEEL_PATH=\"$(find dist -name '*.whl' -print -quit)\"\n  if [[ -z \"$WHEEL_PATH\" ]]; then\n    echo \"No wheel artifact found in dist\"\n    exit 1\n  fi\n  rm -r faster_eth_abi\nfi\npython -m tox -e ${{ env.TOXENV\
        \ }} ${{ env.TOX_RECREATE_FLAG }}\nCI_CONTAINER\n"
      continue-on-error: ${{ matrix.pyminor == '13t' || matrix.pyminor == '14t' }}
    - name: Set up Python (macos)
      if: ${{ matrix.os == 'macos-latest' }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.${{ matrix.pyminor }}
        cache: pip
        cache-dependency-path: 'setup.py

          pyproject.toml

          tox.ini

          '
    - name: Set up Python
      if: ${{ matrix.os != 'macos-latest' && env.IS_UBUNTU_32BIT != 'true' }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.${{ matrix.pyminor }}
        architecture: ${{ matrix.architecture }}
        cache: pip
        cache-dependency-path: 'setup.py

          pyproject.toml

          tox.ini

          '
    - name: Build wheel with mypycify
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      uses: BobTheBuidler/mypycify@v0.5.1
      with:
        python-version: 3.${{ matrix.pyminor }}
        python-architecture: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' && matrix.architecture || '' }}
        hash-key: 'faster_eth_abi/**/*.py

          pyproject.toml

          setup.py

          .github/mypycify-hash/${{ matrix.architecture }}.txt

          '
        build-from: ${{ matrix.installmode }}
        pip-cache-dependency-path: 'pyproject.toml

          setup.py

          tox.ini

          '
    - name: Restore Windows x86 Python
      if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.${{ matrix.pyminor }}
        architecture: ${{ matrix.architecture }}
    - name: Validate Windows x86 Python
      if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
      run: python -c "import struct; bits = struct.calcsize('P') * 8; assert bits == 32, bits"
    - name: Validate Windows x86 wheel tag
      if: ${{ matrix.os == 'windows-latest' && matrix.architecture == 'x86' }}
      shell: bash
      run: "shopt -s nullglob\nwheels=(dist/*.whl)\nif [[ \"${#wheels[@]}\" -ne 1 ]]; then\n  echo \"Expected exactly one wheel in dist, found ${#wheels[@]}\"\n  printf '%s\\n' \"${wheels[@]}\"\n  exit 1\nfi\nwheel=\"${wheels[0]}\"\nif [[ \"$wheel\" != *-win32.whl ]]; then\n  echo \"Expected Windows x86 wheel tagged win32, got: $wheel\"\n  exit 1\nfi\n"
    - name: Upgrade pip and install tox
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      run: 'python -m pip install --upgrade pip

        python -m pip install tox

        '
    - name: Cache .mypy_cache
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      uses: actions/cache@v6
      with:
        path: .mypy_cache
        key: mypy-cache-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}
    - name: Cache tox environment and hypothesis examples
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      uses: actions/cache@v6
      with:
        path: '.tox

          .hypothesis

          '
        key: ${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-${{ matrix.architecture }}-${{ matrix.jobtype }}
        save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}
    - name: Remove Python files so wheel will be used
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      run: rm -r faster_eth_abi
    - name: Run tox
      if: ${{ env.IS_UBUNTU_32BIT != 'true' }}
      run: "shopt -s nullglob\nwheels=(dist/*.whl)\nif [[ \"${#wheels[@]}\" -ne 1 ]]; then\n  echo \"Expected exactly one compiled wheel in dist, found ${#wheels[@]}\"\n  exit 1\nfi\nWHEEL_PATH=\"${wheels[0]}\"\nif [[ \"${{ matrix.jobtype }}\" == \"wheel\" ]]; then\n  WHEEL_PATH=\"$WHEEL_PATH\" python -m tox run ${{ env.TOX_RECREATE_FLAG }}\nelse\n  python -m tox run ${{ env.TOX_RECREATE_FLAG }} --installpkg=\"$WHEEL_PATH\"\nfi\n"
      shell: bash
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  linux:
    permissions:
      contents: read
    uses: SatoshiAndKin/faster-eth-abi/.github/workflows/tox-reviewed-linux.yaml@505764e9f22fbfd24a972a4e4fb68946151225bc
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (tox.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - test
    - linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["test","linux"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
'on':
  pull_request:
    paths:
    - '**'
    branches:
    - master
  schedule:
  - cron: 0 11 * * *
  workflow_dispatch: null
