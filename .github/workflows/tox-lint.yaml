---
name: Tox (Lint)
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["**.py",".github/workflows/tox-lint.yaml",".pre-commit-config.yaml",".github/workflows/tox-lint-reviewed-linux.yaml","pyproject.toml","setup.py","tox.ini"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  lint:
    name: Lint (3.${{ matrix.pyminor }}, ${{ matrix.os }})
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - windows-latest
        pyminor:
        - '10'
        - '11'
        - '12'
        - '13'
        - 13t
        - '14'
        - 14t
      max-parallel: "${{ github.event_name == 'schedule' && 4 || 1000 }}"
    env:
      TOXENV: py3${{ matrix.pyminor }}-lint
      TOX_RECREATE_FLAG: "${{ github.event_name == 'schedule' && '-r' || '' }}"
    steps:
    - name: Checkout code and tests
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.${{ matrix.pyminor }}
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
          tox.ini
    - name: Upgrade pip and install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Cache tox environment and hypothesis examples
      uses: actions/cache@v6
      with:
        path: |
          .tox
          .hypothesis
        key: "${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-lint"
        save-always: "${{ env.TOX_RECREATE_FLAG == '-r' }}"
    - name: Run tox
      run: python -m tox run ${{ env.TOX_RECREATE_FLAG }}
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  linux:
    permissions:
      contents: read
    uses: SatoshiAndKin/faster-eth-abi/.github/workflows/tox-lint-reviewed-linux.yaml@3012426f7fdedafa8a44af18ff8871f7f3254825
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (tox-lint.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - lint
    - linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["lint","linux"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  pull_request:
    paths: ["**"]
    branches:
    - master
  workflow_dispatch:
