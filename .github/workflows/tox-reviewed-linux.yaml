name: Reviewed Linux Tox

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.jobtype }}, 3.${{ matrix.pyminor }}, ${{ matrix.os }}, ${{ matrix.architecture }}, ${{ matrix.installmode }})
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    strategy:
      fail-fast: false
      matrix:
        jobtype: [core, wheel]
        os: [ubuntu-latest]
        architecture: [x64]
        pyminor: ["10", "11", "12", "13", "13t", "14", "14t"]
        installmode: [source, sdist]
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ github.event_name == 'schedule' && 4 || 1000 }}
    env:
      TOXENV: py3${{ matrix.pyminor }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}

    steps:
      - name: Checkout code and tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml
            tox.ini

      - name: Build wheel with mypycify
        uses: BobTheBuidler/mypycify@v0.5.1
        with:
          python-version: 3.${{ matrix.pyminor }}
          python-architecture: x64
          hash-key: |
            faster_eth_abi/**/*.py
            pyproject.toml
            setup.py
            .github/mypycify-hash/${{ matrix.architecture }}.txt
          build-from: ${{ matrix.installmode }}
          pip-cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini

      - name: Upgrade pip and install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Cache .mypy_cache
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: k3s-mypy-cache-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}

      - name: Cache tox environment and hypothesis examples
        uses: actions/cache@v6
        with:
          path: |
            .tox
            .hypothesis
          key: k3s-${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-${{ matrix.architecture }}-${{ matrix.jobtype }}
          save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

      - name: Remove Python files so wheel will be used
        run: rm -r faster_eth_abi

      - name: Run tox
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one compiled wheel in dist, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL_PATH="${wheels[0]}"
          if [[ "${{ matrix.jobtype }}" == "wheel" ]]; then
            WHEEL_PATH="$WHEEL_PATH" python -m tox run ${{ env.TOX_RECREATE_FLAG }}
          else
            python -m tox run ${{ env.TOX_RECREATE_FLAG }} --installpkg="$WHEEL_PATH"
          fi
        shell: bash
