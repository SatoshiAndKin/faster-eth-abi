name: Lint
'on':
  pull_request:
    branches:
    - master  # blocklint: exact branch name pragma
    paths:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '[".github/workflows/**", "!.github/workflows/lint.yaml", ".gitignore", "*.md"]'
      run: python3 .github/scripts/ci_changes.py
  autoflake:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'
    - name: Install Autoflake
      run: pip install autoflake==2.2.1
    - name: Run Autoflake
      run: autoflake --remove-all-unused-imports --in-place --expand-star-imports --ignore-init-module-imports -r
        .
    - name: Verify formatter leaves source unchanged
      run: git diff --exit-code
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
    permissions:
      contents: read
  ci_gate:
    name: CI (lint.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - autoflake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["autoflake"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
permissions:
  contents: read
